<!DOCTYPE html>
<html>
<head>
    <title>Pollution Source Predictor</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #74ebd5, #9face6);
            text-align: center;
        }
        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px gray;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-bottom: 20px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pollution Source Prediction</h2>

    <form action="/predict" method="post">
        <input type="text" name="pm10" placeholder="PM10" required>
        <input type="text" name="no2" placeholder="NO2" required>
        <input type="text" name="so2" placeholder="SO2" required>
        <input type="text" name="co" placeholder="CO" required>
        <input type="text" name="o3" placeholder="O3" required>

        <input type="text" name="temperature" placeholder="Temperature" required>
        <input type="text" name="humidity" placeholder="Humidity" required>
        <input type="text" name="wind_speed" placeholder="Wind Speed" required>
        <input type="text" name="wind_direction" placeholder="Wind Direction" required>

        <input type="text" name="distance_to_road_m" placeholder="Distance to Road (m)" required>
        <input type="text" name="distance_to_industry_m" placeholder="Distance to Industry (m)" required>
        <input type="text" name="distance_to_farmland_m" placeholder="Distance to Farmland (m)" required>
        <input type="text" name="distance_to_dump_m" placeholder="Distance to Dump (m)" required>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <div class="result" style="background-color: {{ color }}">
            {{ prediction }}
        </div>
    {% endif %}

    <footer>
        AI-Based Pollution Source Classification System
    </footer>

</div>

</body>
</html>
